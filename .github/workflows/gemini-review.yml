name: Gemini FRC Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  gemini-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/gemini'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Step 1: Acknowledge Command with Reactions API (using gh CLI)
      - name: Acknowledge Command
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content="eyes"

      # Step 2: Fetch PR Diff
      - name: Fetch PR Diff
        id: fetch_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            PR_NUM="${{ github.event.issue.number }}"
          fi

          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV

          # Get raw diff via gh CLI
          gh pr diff "$PR_NUM" --repo "${{ github.repository }}" > pr_diff.txt
          head -c 20000 pr_diff.txt > trimmed_diff.txt

      # Step 3: Run Gemini & Post Comment using GitHub CLI
      - name: Post Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          USER_COMMENT: ${{ github.event.comment.body }}
        run: |
          SYSTEM_INSTRUCTION="You are a lead mentor for an FRC programming team. Review this PR code diff for WPILib best practices, safety, and bugs. Keep feedback clear, educational, and constructive."

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            EXTRA=$(echo "$USER_COMMENT" | sed 's/\/gemini//g')
            if [ -n "$EXTRA" ]; then
              SYSTEM_INSTRUCTION="$SYSTEM_INSTRUCTION Student note: $EXTRA"
            fi
          fi

          # Prepare JSON payload safely
          DIFF_CONTENT=$(jq -sR . < trimmed_diff.txt)

          # Call Gemini API
          RESPONSE=$(python3 -c "
import urllib.request, json, os

api_key = os.environ['GEMINI_API_KEY']
url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}'

prompt = os.environ['SYSTEM_INSTRUCTION'] + '\n\nDiff:\n' + open('trimmed_diff.txt').read()

data = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode('utf-8')
req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})

try:
    with urllib.request.urlopen(req) as res:
        res_data = json.loads(res.read().decode())
        print(res_data['candidates'][0]['content']['parts'][0]['text'])
except Exception as e:
    print('Failed to generate review:', e)
")

          # Save output to a markdown file
          echo "🤖 **Gemini Code Review**" > review.md
          echo "" >> review.md
          echo "$RESPONSE" >> review.md

          # Post to PR using gh pr comment
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file review.md
